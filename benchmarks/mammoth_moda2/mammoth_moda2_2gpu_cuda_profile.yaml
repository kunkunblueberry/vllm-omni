# Profiling-only variant of mammoth_moda2_2gpu.yaml.
# Use with Nsight's cudaProfilerApi capture range. It is not a performance
# configuration and must not be used for latency A/B measurements.
async_chunk: false
pipeline: mammoth_moda2

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 16
    max_model_len: 8192
    gpu_memory_utilization: 0.8
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    profiler_config:
      profiler: cuda

  - stage_id: 1
    devices: "1"
    max_num_seqs: 1
    gpu_memory_utilization: 0.3
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    profiler_config:
      profiler: cuda
    default_sampling_params:
      extra_args:
        text_guidance_scale: 1.0
        cfg_range: [0.0, 1.0]
        num_inference_steps: 2
